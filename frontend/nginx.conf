# nginx configuration for the containerised CricketVision frontend.
#
# The browser talks only to this origin. /api is proxied to the backend service
# name on the Compose network, so no localhost address is baked into the build.
# Timeouts and body size are deliberately larger than the default because
# cricket uploads and analysis jobs are long-running.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Must be at least CRICKET_MAX_UPLOAD_BYTES (2 GiB by default).
    client_max_body_size 2g;

    # Do not buffer an upload in nginx before forwarding it to the API. The
    # backend performs its own streaming size check.
    proxy_request_buffering off;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Analysis jobs can legitimately take up to CRICKET_MAX_JOB_SECONDS
        # (one hour by default). These are transport limits, not job limits.
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
